<title>CricRegime</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: scoreboard-style home. Live strip on top, match tabs + news rail, then a filterable day schedule. */
:root{
  --bg:#e9eff9; --surface:rgba(255,255,255,.55); --glass-border:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.9); --glass-top:rgba(233,239,249,.72); --blob1:rgba(11,87,224,.30); --blob2:rgba(0,200,255,.26); --ink:#0f1a33; --muted:#586583; --line:#d2daea;
  --accent:#0b57e0; --accent-ink:#ffffff; --live:#d6361f; --amber:#a8660a; --chip:#e1e8f5;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060e24; --surface:rgba(30,56,120,.34); --glass-border:rgba(160,190,255,.22); --glass-hi:rgba(190,212,255,.28); --glass-top:rgba(6,14,36,.62); --blob1:rgba(40,100,255,.38); --blob2:rgba(0,190,255,.22); --ink:#e8eefc; --muted:#93a3c7; --line:#1d2d57;
  --accent:#4d8dff; --accent-ink:#04102b; --live:#ff6a52; --amber:#f0b24a; --chip:#14234a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060e24; --surface:rgba(30,56,120,.34); --glass-border:rgba(160,190,255,.22); --glass-hi:rgba(190,212,255,.28); --glass-top:rgba(6,14,36,.62); --blob1:rgba(40,100,255,.38); --blob2:rgba(0,190,255,.22); --ink:#e8eefc; --muted:#93a3c7; --line:#1d2d57;
  --accent:#4d8dff; --accent-ink:#04102b; --live:#ff6a52; --amber:#f0b24a; --chip:#14234a; color-scheme:dark}

*{box-sizing:border-box}
body{background:radial-gradient(620px 420px at 8% -4%,var(--blob1),transparent 70%),radial-gradient(720px 520px at 96% 18%,var(--blob2),transparent 70%),radial-gradient(640px 520px at 40% 100%,var(--blob1),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.brand img{width:34px;height:34px;border-radius:50%;display:block}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:6px 12px;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted)}
nav a:hover{background:var(--chip);color:var(--ink)}

/* live strip */
.live-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:24px}
.live-head h2{font-size:30px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--live);margin-right:8px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.strip{display:flex;gap:12px;overflow-x:auto;padding:14px 0 6px;scroll-snap-type:x proximity}
.live-card{flex:0 0 min(320px,86%);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.meta b{color:var(--live)}
.teamrow{display:flex;align-items:center;gap:10px;min-width:0}
.code{font-family:var(--mono);font-weight:700;font-size:12px;background:var(--chip);border-radius:5px;padding:3px 6px;min-width:46px;text-align:center}
.tname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.score{font-family:var(--mono);font-weight:700;font-size:15px;white-space:nowrap}
.score.dim{color:var(--muted);font-weight:500}
.status{font-size:13px;color:var(--amber);font-weight:600}
.bats{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;padding-block:28px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sec-title{font-size:30px}
.list{display:flex;flex-direction:column;gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px;min-width:0}
.match .actions{display:flex;gap:14px;font-size:13px;font-weight:600;color:var(--accent);padding-top:4px}
.when{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* rail */
.rail{display:flex;flex-direction:column;gap:28px;min-width:0}
.rail h3{font-size:22px;margin-bottom:10px}
.news{display:flex;flex-direction:column}
.news a{padding:12px 0;border-bottom:1px solid var(--line);display:block}
.news a:first-child{padding-top:0}
.news .tag{font-size:11.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.news .hl{font-weight:600;line-height:1.35;display:block;margin:2px 0}
.news .ago{font-size:12px;color:var(--muted)}
.series{display:flex;flex-direction:column;gap:2px}
.series div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:500;min-width:0}
.series span:first-child{min-width:0}
.series span:last-child{color:var(--muted);font-family:var(--mono);font-size:12.5px;white-space:nowrap}

/* schedule */
.sched{padding-block:8px 36px}
.days{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.day{flex:0 0 auto;min-width:64px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.day strong{font-family:var(--mono);font-size:18px}
.day[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-selected="true"] small{color:inherit;opacity:.75}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fx{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fx .t{font-family:var(--mono);font-weight:700}
.fx .t small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.fx .vs{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tm{display:inline-flex;align-items:center;gap:8px;min-width:0}
.fx .vs i{font-style:normal;color:var(--muted);font-weight:500;font-size:12px}
.fx .sub{font-size:12.5px;color:var(--muted);min-width:0}
.fmt{font-family:var(--mono);font-size:11.5px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--muted)}
.fmt.live{color:var(--live);border-color:var(--live)}
.empty{padding:24px 0;color:var(--muted)}
@media (max-width:520px){.fx{grid-template-columns:70px minmax(0,1fr)}.fx .fmt{grid-column:2;justify-self:start}}

/* glass */
.live-card,.match,.day,.tab,.top{-webkit-backdrop-filter:blur(16px) saturate(165%);backdrop-filter:blur(16px) saturate(165%)}
.live-card,.match,.day,.tab{background:var(--surface);border:1px solid var(--glass-border);box-shadow:0 10px 28px -14px rgba(8,30,90,.45),inset 0 1px 0 var(--glass-hi)}
.top{background:var(--glass-top)}
.code{background:var(--chip);border:1px solid var(--glass-border)}
.flag{position:relative;flex:0 0 auto;width:30px;height:20px;border-radius:6px;overflow:hidden;border:1px solid var(--glass-border);box-shadow:0 3px 8px -3px rgba(8,30,90,.5),inset 0 0 0 1px rgba(255,255,255,.18);display:inline-block}
.flag svg{display:block;width:100%;height:100%}
.flag::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.12) 38%,rgba(255,255,255,0) 52%,rgba(255,255,255,.14) 100%);pointer-events:none}
.fx{border-bottom-color:var(--glass-border)}

/* header v2: floating glass bar */
.top{border-bottom:0;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding-block:10px 4px}
.bar{background:var(--surface);border:1px solid var(--glass-border);border-radius:20px;padding:10px 14px;gap:16px;box-shadow:0 14px 34px -18px rgba(8,30,90,.55),inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%)}
.brand{gap:12px;font-size:inherit}
.brand img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px var(--glass-hi),0 6px 16px -4px rgba(11,87,224,.6)}
.bname{display:flex;flex-direction:column;font-family:var(--display);font-weight:800;font-size:30px;line-height:.95;letter-spacing:.03em;text-transform:uppercase}
.bname small{font-family:var(--body);font-weight:500;font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin-top:3px}
nav{margin-left:auto;gap:2px;background:var(--chip);border:1px solid var(--glass-border);border-radius:999px;padding:4px}
nav a{border-radius:999px;padding:7px 16px}
nav a:hover{background:var(--accent);color:var(--accent-ink)}
.tools{display:flex;align-items:center;gap:8px}
.livepill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--live);border:1px solid var(--live);background:transparent}
.livepill .dot{margin:0}
.themebtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--glass-border)}
.themebtn:hover{background:var(--accent);color:var(--accent-ink)}
@media (max-width:760px){
  .bar{gap:10px}
  nav{order:3;width:100%;margin-left:0;overflow-x:auto;justify-content:space-between}
  .tools{margin-left:auto}
  .bname{font-size:26px}
}


footer{border-top:1px solid var(--line);padding-block:24px 40px;color:var(--muted);font-size:13px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
</style>

});

// match tabs
var TABS=[["up","Upcoming"],["res","Results"]];

function renderMatches(){
